---
name: Node.js CI
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - name: 저장소 Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Node.js 설정
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: "${{ inputs.node-version }}"
        cache: npm
        cache-dependency-path: "${{ vars.NPM_LOCKFILE || 'package-lock.json' }}"
    - name: 의존성 설치
      run: npm ci
    - name: 저장소 검사 실행
      run: |
        npm run check
        npm run build
'on':
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
        required: false
