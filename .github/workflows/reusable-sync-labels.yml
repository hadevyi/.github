EB","description":"type: 작업"},{"name":"type:학습","color":"8957E5","description":"type: 학습"},{"name":"type:의존성","color":"BC4C00","description":"type: 의존성"},{"name":"source:기타","color":"D2A8FF","description":"source: 기타"},{"name":"difficulty:쉬움","color":"2DA44E","description":"difficulty: 쉬움"},{"name":"difficulty:보통","color":"D4A72C","description":"difficulty: 보통"},{"name":"difficulty:어려움","color":"CF222E","description":"difficulty: 어려움"},{"name":"topic:정렬","color":"6F42C1","description":"topic: 정렬"},{"name":"topic:탐색","color":"8250DF","description":"topic: 탐색"},{"name":"topic:그래프","color":"8957E5","description":"topic: 그래프"},{"name":"topic:완전탐색","color":"A475F9","description":"topic: 완전탐색"},{"name":"topic:분할정복","color":"BF8FFF","description":"topic: 분할정복"},{"name":"topic:동적계획법","color":"D2A8FF","description":"topic: 동적계획법"},{"name":"topic:탐욕법","color":"6F42C1","description":"topic: 탐욕법"}],"learning":[{"name":"priority:높음","color":"B60205","description":"priority: 높음"},{"name":"priority:보통","color":"D4A72C","description":"priority: 보통"},{"name":"priority:낮음","color":"AFB8C1","description":"priority: 낮음"},{"name":"status:계획","color":"54AEFF","description":"status: 계획"},{"name":"status:진행중","color":"1F6FEB","description":"status: 진행중"},{"name":"status:보류","color":"8B6F47","description":"status: 보류"},{"name":"status:논의필요","color":"EAC54F","description":"status: 논의필요"},{"name":"status:차단됨","color":"4C2E1F","description":"status: 차단됨"},{"name":"type:학습","color":"8957E5","description":"type: 학습"},{"name":"type:의존성","color":"BC4C00","description":"type: 의존성"},{"name":"source:도서","color":"6F42C1","description":"source: 도서"},{"name":"source:온라인강의","color":"8250DF","description":"source: 온라인강의"},{"name":"source:공식문서","color":"8957E5","description":"source: 공식문서"},{"name":"source:시험","color":"A475F9","description":"source: 시험"},{"name":"source:튜토리얼","color":"BF8FFF","description":"source: 튜토리얼"},{"name":"source:기타","color":"D2A8FF","description":"source: 기타"},{"name":"difficulty:쉬움","color":"2DA44E","description":"difficulty: 쉬움"},{"name":"difficulty:보통","color":"D4A72C","description":"difficulty: 보통"},{"name":"difficulty:어려움","color":"CF222E","description":"difficulty: 어려움"},{"name":"topic:프로그래밍기초","color":"6F42C1","description":"topic: 프로그래밍기초"},{"name":"topic:백엔드","color":"8250DF","description":"topic: 백엔드"},{"name":"topic:프론트엔드","color":"8957E5","description":"topic: 프론트엔드"},{"name":"topic:인공지능","color":"A475F9","description":"topic: 인공지능"},{"name":"topic:자동화","color":"BF8FFF","description":"topic: 자동화"},{"name":"topic:데이터베이스","color":"D2A8FF","description":"topic: 데이터베이스"}],"github-profile":[{"name":"priority:높음","color":"B60205","description":"priority: 높음"},{"name":"priority:보통","color":"D4A72C","description":"priority: 보통"},{"name":"priority:낮음","color":"AFB8C1","description":"priority: 낮음"},{"name":"status:계획","color":"54AEFF","description":"status: 계획"},{"name":"status:진행중","color":"1F6FEB","description":"status: 진행중"},{"name":"status:보류","color":"8B6F47","description":"status: 보류"},{"name":"status:논의필요","color":"EAC54F","description":"status: 논의필요"},{"name":"status:차단됨","color":"4C2E1F","description":"status: 차단됨"},{"name":"type:콘텐츠","color":"A475F9","description":"type: 콘텐츠"},{"name":"type:자동화","color":"FFAB40","description":"type: 자동화"},{"name":"type:버그","color":"CF222E","description":"type: 버그"},{"name":"type:의존성","color":"BC4C00","description":"type: 의존성"},{"name":"area:프로필","color":"0969DA","description":"area: 프로필"},{"name":"area:통계","color":"1F6FEB","description":"area: 통계"},{"name":"area:자동화","color":"218BFF","description":"area: 자동화"}]};
            async function syncLabels({ github, context, presets, profile, mode = 'preview', issueNumber = '' }) {
              if (!['preview', 'apply'].includes(mode)) throw new Error('지원하지 않는 실행 모드');
              const aliases = { governance: 'github-governance', branding: 'branding-site', profile: 'github-profile' };
              const selected = Object.hasOwn(aliases, profile) ? aliases[profile] : profile;
              if (!Object.hasOwn(presets, selected)) throw new Error('등록되지 않은 라벨 프로필');
              const { owner, repo } = context.repo;
              if (owner !== 'hadevyi') throw new Error('관리 대상 소유자가 아님');
              const { data: repository } = await github.rest.repos.get({ owner, repo });
              if (repository.archived || repository.fork) throw new Error('아카이브·Fork는 적용 대상에서 제외');
              if (mode === 'apply') {
                if (context.eventName !== 'workflow_dispatch') throw new Error('적용은 명시적인 수동 실행만 허용');
                if (!/^[1-9]\d*$/.test(issueNumber)) throw new Error('적용에는 같은 저장소의 열린 Issue 번호가 필요');
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: Number(issueNumber) });
                if (issue.state !== 'open' || issue.pull_request) throw new Error('열린 Issue가 아님');
              }
              const desired = presets[selected];
              const names = new Set();
              for (const label of desired) {
                if (!/^[a-z]+:[^\s:]+$/.test(label.name) || !/^[0-9a-f]{6}$/i.test(label.color)) {
                  throw new Error('라벨 이름 또는 색상이 유효하지 않음');
                }
                const key = label.name.toLowerCase();
                if (names.has(key)) throw new Error('중복 라벨 정의');
                names.add(key);
              }
              const existing = await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 });
              const byName = new Map(existing.map(label => [label.name.toLowerCase(), label]));
              const plan = { profile: selected, mode, create: [], update: [], preserve: [] };
              for (const label of desired) {
                const current = byName.get(label.name.toLowerCase());
                if (!current) plan.create.push(label);
                else if (current.color.toLowerCase() !== label.color.toLowerCase() || (current.description || '') !== label.description) {
                  plan.update.push({ name: current.name, color: label.color, description: label.description });
                }
              }
              plan.preserve = existing.filter(label => !names.has(label.name.toLowerCase())).map(label => label.name);
              if (mode === 'apply') {
                for (const label of plan.create) await github.rest.issues.createLabel({ owner, repo, ...label });
                for (const label of plan.update) await github.rest.issues.updateLabel({ owner, repo, ...label });
              }
              return plan;
            }

            const plan = await syncLabels({ github, context, presets,
              profile: process.env.LABEL_PROFILE, mode: process.env.LABEL_MODE,
              issueNumber: process.env.LABEL_ISSUE });
            core.info(JSON.stringify(plan, null, 2));
            await core.summary.addHeading('라벨 동기화 계획').addCodeBlock(JSON.stringify(plan, null, 2), 'json').write();
