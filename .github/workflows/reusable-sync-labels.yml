# render-label-sync 생성 파일. 프로필 선택표와 label-sync.cjs를 수정한다.
name: Reusable shared label sync

on:
  workflow_call:
    inputs:
      profile:
        description: 확정 프로필 또는 기존 호출용 별칭
        required: true
        type: string
      mode:
        description: preview 또는 apply. 기본값은 원격 변경 없는 미리보기
        required: false
        type: string
        default: preview
      issue_number:
        description: 적용 시 같은 저장소의 관련 열린 Issue 번호
        required: false
        type: string
        default: ""

permissions:
  issues: write

concurrency:
  group: label-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 라벨 미리보기 또는 생성·갱신
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LABEL_PROFILE: ${{ inputs.profile }}
          LABEL_MODE: ${{ inputs.mode }}
          LABEL_ISSUE: ${{ inputs.issue_number }}
