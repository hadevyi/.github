---
name: Discord GitHub 알림
'on':
  issues:
    types:
    - opened
  pull_request:
    types:
    - opened
  workflow_run:
    workflows:
    - Sync shared labels
    - PR 담당자 자동 지정
    - Issue 담당자 자동 지정
    types:
    - completed
permissions:
  contents: read
jobs:
  notify:
    uses: "./.github/workflows/reusable-discord-notify.yml"
    with:
      bot-name: Branch Bot
    secrets:
      DISCORD_WEBHOOK_URL: "${{ secrets.DISCORD_WEBHOOK_URL }}"
